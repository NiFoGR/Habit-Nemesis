<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Local app, so the policy is strict. Inline styles are allowed because
       the UI sets element styles; blob: and data: images are the gallery and
       the icons. Capacitor injects its bridge before this tag is parsed.
       A blank native build: check here first. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- Pinch-zoom stays available: blocking it is an accessibility problem. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="NiFo. Personal app for kegels, length training, prayer, Bible reading and habits.">
  <title>NiFo</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <!-- iPhone. Before 16.4 iOS reads these rather than the manifest, and takes
       this icon: 180 square and opaque, because iOS composites transparency
       onto white and rounds the corners itself.
       black-translucent is safe only because every screen pads with --safe-t
       and --safe-b. A title under the clock means that pair, not this tag. -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NiFo">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <!-- Outside #app: the router replaces #app on every route, and a bar rebuilt
       every navigation cannot animate. js/tabs.js fills it once. -->
  <nav id="tabs" class="tabbar" hidden></nav>
  <noscript>NiFo needs JavaScript enabled.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
