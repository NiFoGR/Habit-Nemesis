<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Nearly a local app, so the policy stays strict. connect-src admits the
       account service and nothing else; supabase-js is vendored under
       js/vendor/ rather than loaded from a CDN, so script-src is still 'self'
       and the app still starts with no network at all. Inline styles are allowed because
       the UI sets element styles; data: and blob: images are the icons and the
       share card. Capacitor injects its bridge before this tag is parsed.
       A blank native build: check here first. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- Pinch-zoom stays available: blocking it is an accessibility problem. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Habit Nemesis. A habit grid, and a week that plays the best week you ever had.">
  <title>Habit Nemesis</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <!-- iPhone. Before 16.4 iOS reads these rather than the manifest, and takes
       this icon: 180 square and opaque, because iOS composites transparency
       onto white and rounds the corners itself.
       black-translucent is safe only because every screen pads with --safe-t
       and --safe-b. A title under the clock means that pair, not this tag. -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habit Nemesis">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <!-- Outside #app: the router replaces #app on every route, and a bar rebuilt
       every navigation cannot animate. js/tabs.js fills it once. -->
  <nav id="tabs" class="tabbar" hidden></nav>
  <noscript>Habit Nemesis needs JavaScript enabled.</noscript>
  <!-- Not a module: the vendored UMD bundle defines window.supabase, and it has
       to be there before the first module that reads it. -->
  <script src="./js/vendor/supabase.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
