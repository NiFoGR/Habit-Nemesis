<!doctype html>
<meta charset="utf-8">
<title>NiFo</title>
<!--
  Only GitHub Pages reads this file, and only when Pages is set to "Deploy from
  a branch" instead of "GitHub Actions".

  In that mode Pages serves the repository root, and the repository root has no
  app in it: the app is in www/. So the site answered 404 for every URL. This
  redirect sends the branch-served site into the app.

  It is a safety net, not the intended route. Under Source: GitHub Actions,
  pages.yml publishes dist-web/, this file is not in that build, and nothing
  here runs. That route is the one to want: it ships 1 MB rather than 8,
  because pack-web.mjs leaves out the scripture.
-->
<meta http-equiv="refresh" content="0; url=./www/index.html">
<link rel="canonical" href="./www/index.html">
<body style="background:#0b0f14;color:#e6edf3;font:16px system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100dvh">
  <p><a href="./www/index.html" style="color:#22d3c5">Open NiFo</a></p>
</body>
