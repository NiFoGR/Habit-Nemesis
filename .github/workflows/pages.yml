name: Deploy to GitHub Pages

# Publishes the app so it can be installed straight to a phone's home screen.
# This is the only route onto an iPhone, which cannot sideload an APK.
#
# It publishes `dist-web/`, and it must never publish `www/`.
#
# That is not a style preference. `www/bible/` holds the full text of the
# Orthodox Study Bible; putting it on a public website is redistributing a
# commercial translation in bulk, and docs/BIBLE.md sets out the line. The
# earlier version of this workflow uploaded `www` directly, which is why it was
# deleted outright rather than switched off. It is back only because
# `tools/pack-web.mjs` now exists to produce a copy with the scripture left
# out, and because that script refuses to finish if any ever reaches the
# output - so the invariant is enforced by the build rather than by whoever
# edits this file next.
#
# Needs Pages switched on once, under Settings -> Pages -> Source: GitHub
# Actions. The workflow token cannot do that itself (configure-pages with
# enablement: true returns "Resource not accessible by integration"), so the
# first run fails until that box is ticked.
on:
  push:
    branches: [claude/nifo-kegel-tracking-h86l0u]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the publishable copy
        # Writes dist-web/ = www/ minus www/bible/, and exits non-zero if a
        # single scripture file reaches it. A failure here is the guard doing
        # its job; do not work around it.
        run: node tools/pack-web.mjs

      - name: Refuse to deploy scripture
        # Said twice on purpose. The check above lives with the script that
        # builds the folder and could be edited in the same commit that breaks
        # it; this one lives with the step that publishes, which is the thing
        # that actually does the harm.
        run: |
          if find dist-web -path '*/bible/*' -name '*.json' | grep -q .; then
            echo "::error::Scripture reached dist-web/. See docs/BIBLE.md."
            exit 1
          fi
          echo "dist-web/ carries no scripture: $(find dist-web -type f | wc -l) files"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
