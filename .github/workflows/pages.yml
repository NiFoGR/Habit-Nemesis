name: Deploy to GitHub Pages

# Publishes www/ so the app can be installed straight to a phone home screen
# as a PWA. Needs Pages switched on once, under
# Settings → Pages → Source: GitHub Actions. The workflow token cannot do it
# itself (configure-pages with enablement: true returns "Resource not
# accessible by integration"), so this run fails until that box is ticked.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
