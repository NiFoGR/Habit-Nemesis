name: Deploy to GitHub Pages

# Publishes the app so it can be installed straight to a phone's home screen.
# This is the only route onto an iPhone until the App Store build exists.
#
# Pages is switched on and deploying. It needed a human once, under Settings ->
# Pages -> Source: GitHub Actions, because enablement: true below asks the
# workflow token to do it and the token is refused ("Resource not accessible by
# integration"), tested, not assumed.
#
# The deploy is no longer continue-on-error. This is where
# legal/privacy.html is served from, Play requires that URL to resolve before it
# will list the app, and a deploy that fails quietly is how it stops resolving
# without anyone noticing.
on:
  push:
    # The default branch. Rename it here if the branch is ever renamed.
    branches: [claude/copy-nifo-app-habit-nemesis-b92gim]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The calendar maths and the stylesheet's own rules. A broken build must not
  # reach the phones this deploys to.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Run the checks
        run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report what is being published
        run: |
          echo "www/ holds $(find www -type f | wc -l) files, $(du -sh www | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
